[project]
name = "bugrewind"
version = "0.1.0"
description = "AI-powered secure deployment system using multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "websockets>=16.0",
    "python-multipart>=0.0.24",
]

[project.scripts]
bugrewind = "bugrewind.main:main"
bugrewind-mcp = "bugrewind.mcp_server:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
